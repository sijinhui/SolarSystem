# Compile test only: firmware is signed with a throwaway key generated in CI,
# so the artifacts will NOT be accepted by devices running a real-key build.
name: build-firmware

on:
  push:
  workflow_dispatch:
    inputs:
      loglevel:
        description: "Log level for a debug build (ERROR = upstream default)"
        default: ERROR
        type: choice
        options: [ERROR, WARN, INFO, DEBUG]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    strategy:
      fail-fast: false
      matrix:
        variant: [s3oct, s3]
    steps:
      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends csh libpopt-dev openssl

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Throwaway signing keys (test only, never committed)
        run: |
          openssl genrsa -out ESP32/secure_boot_signing_key_rsa.pem 3072
          openssl ecparam -name prime256v1 -genkey -noout -out ESP32/secure_boot_signing_key_ecdsa.pem

      - name: Build ${{ matrix.variant }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh" >/dev/null
          LOGLEVEL="${{ inputs.loglevel || 'ERROR' }}"
          if [ "$LOGLEVEL" != ERROR ]; then
            cp ESP32/sdkconfig.defaults ESP32/sdkconfig
            sed -i -e 's/^CONFIG_LOG_DEFAULT_LEVEL_ERROR=y/# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set/' \
                   -e "s/^# CONFIG_LOG_DEFAULT_LEVEL_${LOGLEVEL} is not set/CONFIG_LOG_DEFAULT_LEVEL_${LOGLEVEL}=y/" \
                   -e '/^CONFIG_LOG_DEFAULT_LEVEL=/d' -e '/^CONFIG_LOG_MAXIMUM_LEVEL=/d' ESP32/sdkconfig
          fi
          make -C ESP32 ${{ matrix.variant }}
          grep -E '^(# )?CONFIG_(SPIRAM_MODE_(QUAD|OCT)|REVK_BUILD_SUFFIX|REVK_GPIO_INIT|LOG_DEFAULT_LEVEL[A-Z_]*)[ =]' ESP32/sdkconfig
          ls -l www/SS-*.bin

      - uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-throwaway-key-${{ matrix.variant }}-${{ inputs.loglevel || 'ERROR' }}
          path: |
            www/SS-*.bin
            ESP32/build/SS-unsigned.bin
            ESP32/build/SS.elf
            ESP32/build/bootloader/bootloader.bin
            ESP32/build/partition_table/partition-table.bin
            ESP32/build/ota_data_initial.bin
            ESP32/build/flasher_args.json
